name: Railway Deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  resolve-target:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - id: target
        name: Resolve branch environment
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Verify workspace
    # Only for the target name, which the release guard below branches on.
    needs:
      - resolve-target
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The version guard below reads package.json at the commit main was on
          # before this push, which a shallow clone does not have.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Versions move at promotion and nowhere else (docs/releases.md), so a
      # production release with changesets still pending is one that ships user-
      # visible changes under the previous version number — the sidebar names a
      # build the agency is not on, and the changelog omits what they just got.
      # Staging is exempt by design: that is where changesets accumulate.
      - name: Require the release to be cut
        if: needs.resolve-target.outputs.environment == 'production'
        run: |
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')

          if [ -n "$pending" ]; then
            echo "::error::Production deploy with unconsumed changesets."
            echo
            echo "Run 'pnpm release:version' on the promotion branch and commit"
            echo "the result before merging to main."
            echo
            printf '%s\n' "$pending" | sed 's/^/  /'
            exit 1
          fi

          echo "No pending changesets; the release is cut."

      # The check above cannot see the release that was never cut. A promotion
      # carrying only refactors has nothing pending to catch, and under the old
      # reading of the rule that looked finished — which is how two different
      # production builds end up both answering to one version number. Every
      # promotion bumps both apps, so a version that did not move is a
      # `pnpm release:version` that was not run.
      #
      # Only for a push, and only when the previous commit is known: a manual
      # re-deploy of a release already shipped is a legitimate second deploy of
      # one version, and is also the way past this gate if it is ever wrong.
      - name: Require the versions to have moved
        if: needs.resolve-target.outputs.environment == 'production' && github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "No previous main commit to compare against; skipping."
            exit 0
          fi

          stale=''
          for app in web admin; do
            was=$(git show "$BEFORE:apps/$app/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            now=$(node -p "require('./apps/$app/package.json').version")

            if [ "$was" = "$now" ]; then
              stale="$stale  apps/$app is still on $now"$'\n'
            else
              echo "apps/$app: $was -> $now"
            fi
          done

          if [ -n "$stale" ]; then
            echo "::error::Production deploy that does not bump a version."
            echo
            echo "Every promotion is a release, changelog entries or not."
            echo "Run 'pnpm release:version' on the promotion branch and commit"
            echo "the result before merging to main. See docs/releases.md."
            echo
            printf '%s' "$stale"
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  migrate:
    name: Migrate database
    needs:
      - resolve-target
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.resolve-target.outputs.environment }}
    concurrency:
      group: db-migrate-${{ needs.resolve-target.outputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Require matching branch for manual staging
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
        run: |
          if [ "$GITHUB_REF_NAME" != "staging" ]; then
            echo "Manual staging deploys must run from the staging branch."
            exit 1
          fi

      - name: Require matching branch for manual production
        if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "Manual production deploys must run from the main branch."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          pnpm exec dbmate \
            --url "$DATABASE_URL" \
            --migrations-dir packages/db/migrations \
            --schema-file packages/db/schema.sql \
            --no-dump-schema \
            --wait \
            up

  deploy:
    name: Deploy ${{ matrix.name }}
    needs:
      - resolve-target
      - migrate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ needs.resolve-target.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            service_var: RAILWAY_SERVER_SERVICE
          - name: web
            service_var: RAILWAY_WEB_SERVICE
          # The operator console. Deployed from the same commit as the others
          # because it shares `packages/ui-web` with the web app — a shell or
          # form-kit change that ships to one and not the other is how the two
          # surfaces drift apart again.
          - name: admin
            service_var: RAILWAY_ADMIN_SERVICE

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The only `setup-node` in the repo with no `pnpm/action-setup` before it
      # and no `cache:` input — this job installs the Railway CLI with npm and
      # never runs a workspace command. `setup-node@v5` began caching
      # automatically for whatever `packageManager` names, which would have meant
      # reaching for a pnpm store with no pnpm on PATH; v6 narrowed that to npm
      # only, and this workspace pins pnpm, so nothing is cached here. If that
      # ever flips back, the fix is `package-manager-cache: false`.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT: ${{ vars.RAILWAY_ENVIRONMENT }}
          RAILWAY_SERVER_SERVICE: ${{ vars.RAILWAY_SERVER_SERVICE }}
          RAILWAY_WEB_SERVICE: ${{ vars.RAILWAY_WEB_SERVICE }}
          RAILWAY_ADMIN_SERVICE: ${{ vars.RAILWAY_ADMIN_SERVICE }}
          SERVICE_VAR: ${{ matrix.service_var }}
        run: |
          test -n "$RAILWAY_TOKEN"
          test -n "$RAILWAY_PROJECT_ID"
          test -n "$RAILWAY_ENVIRONMENT"
          service_name="${!SERVICE_VAR}"
          test -n "$service_name"
          # `railway up` uploads the working tree, so no sha travels with it
          # and the deployment carries no commit of its own. The repo watchers
          # that used to stamp one are gone (#373), so the message is the only
          # provenance a Railway deployment has.
          railway up \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$service_name" \
            --message "$GITHUB_SHA" \
            --ci
