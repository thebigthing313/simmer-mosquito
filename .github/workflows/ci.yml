name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - staging
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint, format, and import order, in one pass over every file, and first
      # because it is a second's work. Nothing else here reads style. `typecheck`
      # and `build` are indifferent to it, and `fallow` reads structure rather
      # than syntax. Errors fail the job and the warning backlog does not,
      # because Biome exits on severity. Four errors sat on `staging` because
      # nothing here ran it (#291).
      - name: Lint and format
        run: pnpm check

      # The cheapest of the structural gates, and the only one that can see a
      # build-order drift. `typecheck` and `build` both go through Nx, so they
      # order from the package.json dependency graph and can never disagree with
      # themselves.
      # Every deploy orders from tsconfig `references` instead. This asserts the
      # two name the same edges; the `shipped-build` job below proves it by
      # running the deploy's own command.
      - name: Build graph
        run: pnpm check:build-graph

      # The other half of a command write is hand-typed. A body's `snake_case`
      # key names a column, and `payload` is a loose record, so a misspelled one
      # reads `undefined` and the caller still gets a 200. The reads have a
      # drift test against the database; this is the writes' equivalent.
      - name: Command columns
        run: pnpm check:command-columns

      # A write's own agency comes from the session; the ids it references come
      # from the payload, and a foreign key cannot see whose they are. This
      # asserts every write that names one goes through the reference gate.
      - name: Write references
        run: pnpm check:write-references

      # The search index is a second copy of the corpus tables' text, read back
      # over an endpoint with no column list of its own. This asserts every
      # indexed field is a real column, that none of them is a column sync
      # withholds, and that the declaration and the migration's triggers name
      # the same tables.
      - name: Search corpus
        run: pnpm check:search-corpus

      # An acknowledgement is a flag a client sets to say it meant to remove
      # something. Seventy-three are declared on command payloads, and until
      # #314 nothing read any of them, because a flag lives next to the command
      # that needs it and nothing counted the set. This holds the vocabulary,
      # the payloads and the map of what checks each one together, and ratchets
      # the number nothing checks.
      - name: Acknowledgements
        run: pnpm check:acknowledgements

      - name: Typecheck
        run: pnpm typecheck

      # Structural rot: unused files/exports/dependencies, circular
      # dependencies, unresolved imports. Those default to `error` in fallow and
      # the workspace is at zero, so this fails on what a branch adds rather
      # than on a pre-existing backlog. The softer cleanup rules stay at `warn`
      # by choice (.fallowrc.jsonc).
      #
      # These go through the wrapper rather than `pnpm exec fallow` so a local
      # run on Windows behaves identically; it is a no-op on this runner.
      - name: Dead code
        run: pnpm fallow dead-code

      # Duplication and complexity are gated against where the workspace already
      # is, not against zero — the backlog is thousands of lines and hundreds of
      # units, so an absolute gate would fail every branch on history rather than
      # catch anything new.
      #
      # Duplication ratchets on the percentage in .fallowrc.jsonc. Complexity
      # compares per file and category against a saved baseline, so a branch that
      # adds a hotspot fails while the existing ones stay quiet. Re-save it with
      # `pnpm fallow:baseline` after real complexity comes out — and read a diff
      # to it in review, since a baseline can also be re-saved to bury a
      # regression.
      - name: Duplication
        run: pnpm fallow dupes

      # A saved entry matching no current finding is allowance nothing is using.
      # fallow warns about that and exits 0; scripts/fallow.mjs fails this step
      # on the warning instead, and a step that fails on it is a step asking to
      # be re-saved. See CLAUDE.md, "Rot gates".
      - name: Complexity
        run: pnpm fallow:health

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Builds each deployable app the way its Dockerfile does, and nothing else.
  #
  # `pnpm build` in `verify` is `nx run-many`, which is not the command that
  # ships: every Dockerfile and the server's Railpack build run
  # `pnpm --filter <app> build`, which is `tsc -b` and orders projects from
  # tsconfig `references` alone. When the two graphs disagree the filtered build
  # is the only one that fails, and it fails on the deploy — #175 broke all three
  # services on a merge whose CI was green.
  #
  # One runner per app on purpose, rather than three commands in a row. A
  # filtered build leaves the packages it built on disk, and a `dist` that is
  # already there satisfies an import whose build order was never declared — so
  # the second and third builds in a shared workspace would pass for the wrong
  # reason. That is the same staleness that made #175 read as a local
  # environment fault. Each app needs a tree nothing has built yet.
  #
  # For the same reason, never add a step that builds the workspace above this
  # one.
  #
  # The `VITE_*` values the two SPAs inline are absent here. Nothing ships out of
  # this job; it proves the compile resolves, and nothing more.
  shipped-build:
    name: Shipped build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app: [server, web, admin]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A fresh checkout has no build output, so this removes nothing here. It is
      # the same line the local reproduction needs — where a `dist` from any
      # earlier full build would hide the fault — and it is what keeps this job
      # honest if a build ever appears above it.
      - name: Clean build output
        run: |
          find apps packages -name '*.tsbuildinfo' -not -path '*/node_modules/.pnpm/*' -delete
          rm -rf apps/*/dist packages/*/dist

      - name: Build as the deploy does
        run: pnpm --filter @simmer-mosquito/${{ matrix.app }} build

  # A branch that changes what a user can do carries a changeset (docs/releases.md).
  # "If needed" is a judgement call no path heuristic can make — a refactor and a
  # feature touch the same directories — so this is deliberately a *prompt with an
  # override*, not a wall: it fails only when app-visible source moved with no
  # changeset, and the `no changeset` label says "I considered it, the answer is
  # no". A gate with no override would be answered by filing empty changesets,
  # which is worse than not gating at all.
  #
  # Declining one costs nothing that matters: the version still bumps at
  # promotion, because `pnpm release:version` floors every app the pending
  # changesets did not name. This gate is only ever asking whether the change
  # belongs on the changelog page.
  #
  # Only PRs based on `develop` are asked, in the step below. That is where
  # feature branches land, and it is the only shape where a changeset has not
  # been written yet.
  changeset:
    name: Changeset filed (or declined)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The label read below needs this. The workflow's top-level grant is
    # `contents: read` alone, and a job-level block replaces it rather than
    # adding to it, so the checkout's grant is repeated here.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The comparison is against the merge base, so the base branch's
          # history has to be here — the default shallow clone has neither.
          fetch-depth: 0

      - name: Require a changeset for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # A promotion carries every changeset that was filed since the last
          # release and every one of them already consumed, so they cancel out
          # in this diff while the source they described does not. The gate then
          # sees a release's worth of source with no changeset and fails, every
          # time, on the one PR shape where that is always correct. It used to
          # take the label and a re-run to say so.
          #
          # The release is now cut on the `develop` to `staging` PR (#375), so
          # that is the shape this names, along with a hotfix PR into `main`,
          # which cut and consumed its own changeset on the branch. The job still
          # runs and still reports on every PR rather than skipping itself: all
          # three branch rulesets require this check, and a check that reports no
          # run at all blocks the merge forever.
          if [ "$BASE_REF" != "develop" ]; then
            echo "Base is $BASE_REF, not develop: any changesets here are consumed into the changelogs already."
            exit 0
          fi

          changed=$(git diff --name-only "$BASE"...HEAD)

          if printf '%s\n' "$changed" | grep -qE '^\.changeset/.+\.md$'; then
            echo "A changeset is filed."
            exit 0
          fi

          # Tests and the release tooling itself are not what a user sees, so
          # they do not trigger the prompt even though they live under `src`.
          visible=$(printf '%s\n' "$changed" \
            | grep -E '^(apps/(web|admin|server)|packages/[^/]+)/src/' \
            | grep -vE '/src/tests/' \
            | grep -vE '\.test\.tsx?$' || true)

          if [ -z "$visible" ]; then
            echo "No user-visible source changed; no changeset needed."
            exit 0
          fi

          # Read live rather than from `github.event.pull_request.labels`, which
          # is a snapshot taken when the event fired. `gh pr create --label`
          # opens the PR and applies the label in a second call, so the label is
          # never in the payload of the event it arrives with, and `gh run rerun`
          # replays that same stale payload. Closing and reopening the PR was the
          # only thing that picked the label up. Now adding it and re-running is
          # enough. One API call, made after the path filter above, so a PR with
          # nothing user-visible in it never spends one.
          # No leading slash: a leading-slash endpoint is a path a shell may
          # rewrite, and Git Bash on Windows does, which is how anyone testing
          # this command by hand meets it.
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.labels[].name' | grep -qxF 'no changeset'; then
            echo "Labelled 'no changeset' — the author declined one deliberately."
            exit 0
          fi

          echo "::error::This PR changes app source but files no changeset."
          echo
          echo "If it changes what a user can do, run 'pnpm changeset' and commit the file."
          echo "If it does not — a refactor, a test, a dependency bump — add the"
          echo "'no changeset' label to this PR, then re-run this job."
          echo
          echo "Source files that triggered this:"
          printf '%s\n' "$visible" | sed 's/^/  /'
          exit 1

  # The two gates that used to sit on the production deploy. The release is cut
  # on the `develop` to `staging` PR now, so they sit where the risk does: by
  # the time `main` moves the numbers are days old and a gate on that push is
  # trivially true.
  #
  # Like the changeset job above, this runs on every PR and exits 0 on the shapes
  # it has nothing to say about, rather than skipping itself, so the required
  # check always reports.
  release-cut:
    name: Release cut (or declined)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The label read below needs this. The workflow's top-level grant is
    # `contents: read` alone, and a job-level block replaces it rather than
    # adding to it, so the checkout's grant is repeated here.
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The version check reads package.json at the base commit, which the
          # default shallow clone does not have.
          fetch-depth: 0

      - name: Require the release to be cut
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$BASE_REF" != "staging" ]; then
            echo "Base is $BASE_REF, not staging: no release is cut here."
            exit 0
          fi

          failures=$(mktemp)

          # Versions move at the cut and nowhere else (docs/releases.md), so a
          # candidate with changesets still pending is one that carries
          # user-visible changes under the previous version number: the sidebar
          # names a build the agency is not on, and the changelog omits what they
          # just got.
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')

          if [ -n "$pending" ]; then
            echo "  Unconsumed changesets:" >> "$failures"
            printf '%s\n' "$pending" | sed 's/^/    /' >> "$failures"
          fi

          # The check above cannot see the release that was never cut. A
          # promotion carrying only refactors has nothing pending to catch, and
          # under the old reading of the rule that looked finished, which is how
          # two different builds end up both answering to one version number.
          # Every promotion bumps both apps, so a version that did not move is a
          # `pnpm release:version` that was not run.
          for app in web admin; do
            was=$(git show "$BASE:apps/$app/package.json" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            now=$(node -p "require('./apps/$app/package.json').version")

            if [ "$was" = "$now" ]; then
              echo "  apps/$app is still on $now" >> "$failures"
            else
              echo "apps/$app: $was -> $now"
            fi
          done

          if [ ! -s "$failures" ]; then
            echo "The release is cut."
            exit 0
          fi

          # Read live rather than from `github.event.pull_request.labels`, which
          # is a snapshot taken when the event fired, so a label added after the
          # PR opened is not in it and `gh run rerun` replays the same stale
          # payload. Adding the label and re-running this job is enough.
          #
          # No leading slash: Git Bash on Windows rewrites a leading-slash
          # endpoint as a path, which is how anyone testing this by hand meets it.
          if gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name' \
            | grep -qxF 'release cut declined'; then
            echo "Labelled 'release cut declined': the gate was overridden deliberately."
            exit 0
          fi

          echo "::error::This promotion does not cut a release."
          echo
          echo "Run 'pnpm release:version' on this branch and commit what it writes:"
          echo "the deleted changesets, the two changelogs, and the two version bumps."
          echo "See docs/releases.md."
          echo
          echo "If the gate is wrong, a merge-back that carries no release of its"
          echo "own, add the 'release cut declined' label to this PR and re-run this"
          echo "job."
          echo
          cat "$failures"
          exit 1

  # Split from `verify` on purpose: these suites are the only checks that need a
  # database at all, and they carry a build and a container the others do not.
  # Keeping them separate means the typecheck, build, and pure-test signal is not
  # waiting behind them.
  #
  # The database is a service container rather than the Railway staging Postgres.
  # That is what makes the job fast — every round-trip the harness makes is a
  # loopback one — and it also means the job cannot go red because a shared
  # database was unreachable, cannot churn migrations through the database a
  # developer's dev server is talking to, and needs no secret, so a fork PR gets
  # the same signal as any other.
  database-integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Superseded runs are cancelled for cost: three pushes in a minute would
    # otherwise pay for three full runs of a job nobody is going to read. The
    # database is no longer a reason — a container belongs to one run and dies
    # with it, so a cancelled run can neither pile up against a shared Postgres
    # nor leave a `simmer_test_*` schema behind.
    concurrency:
      group: db-integration-${{ github.ref }}
      cancel-in-progress: true

    services:
      # Matches Railway staging exactly (PostgreSQL 17.5, PostGIS 3.5.2), so the
      # job cannot be green on a version no environment actually runs, and the
      # same image the local compose file uses.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simmer_test
        ports:
          - 5432:5432
        # The suites skip themselves when they cannot reach a database, so the
        # job waits for the container to accept connections rather than racing it.
        options: >-
          --health-cmd "pg_isready -U postgres -d simmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/simmer_test?sslmode=disable
      # The container is destroyed with the job, so no `simmer_test_*` schema can
      # outlive the run and the harness skips its abandoned-schema sweep. The
      # sweep stays on for local and staging runs, where a Ctrl-C still litters.
      SIMMER_TEST_DATABASE_EPHEMERAL: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@simmer-mosquito/server` imports the harness from `@simmer-mosquito/db`
      # at its `./test-support` entry point, so the package has to be built
      # before its integration suite can resolve it.
      - name: Build workspace
        run: pnpm build

      # The migration set creates four extensions `if not exists`, which against
      # a fresh database would create them inside whichever throwaway schema got
      # there first — and take them with it when that schema is dropped. Staging
      # has them in `public` already; the container is given the same starting
      # point, so the migrations are the no-op they are everywhere else.
      #
      # `pg_extension` is keyed by name across the whole database, so this is
      # worse than wasteful. The second schema's `if not exists` finds the name
      # already taken and skips, and then the migration fails on the first thing
      # the extension owns: `gin_trgm_ops` lives in the *first* schema and is not
      # on the second one's `search_path`. Every extension any migration creates
      # belongs on this list.
      - name: Prepare the database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'create extension if not exists postgis' \
            -c 'create extension if not exists pgcrypto' \
            -c 'create extension if not exists pg_trgm' \
            -c 'create extension if not exists btree_gin'

      # Runs the package scripts directly rather than through nx: these suites
      # skip themselves when the URL is missing, so a cached "pass" from a run
      # without it would be indistinguishable from a real one. The guard on the
      # URL stays for the same reason — it is what stops a silently skipped suite
      # from reporting as a pass.
      #
      # `@simmer-mosquito/server` is here as well as `db` because the reads that
      # decide whether a write happens — ownership and assignment lifecycle —
      # live in the server and take a plain `Transaction`. Its pure tests run
      # again as a side effect, which costs seconds.
      - name: Run integration suites
        run: |
          test -n "$TEST_DATABASE_URL"
          pnpm --filter @simmer-mosquito/db test
          pnpm --filter @simmer-mosquito/server test
