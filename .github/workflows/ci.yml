name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Structural rot: unused files/exports/dependencies, circular
      # dependencies, unresolved imports. Those default to `error` in fallow and
      # the workspace is at zero, so this fails on what a branch adds rather
      # than on a pre-existing backlog. The softer cleanup rules stay at `warn`
      # by choice (.fallowrc.jsonc).
      #
      # These go through the wrapper rather than `pnpm exec fallow` so a local
      # run on Windows behaves identically; it is a no-op on this runner.
      - name: Dead code
        run: pnpm fallow dead-code

      # Duplication and complexity are gated against where the workspace already
      # is, not against zero — the backlog is thousands of lines and hundreds of
      # units, so an absolute gate would fail every branch on history rather than
      # catch anything new.
      #
      # Duplication ratchets on the percentage in .fallowrc.jsonc. Complexity
      # compares per file and category against a saved baseline, so a branch that
      # adds a hotspot fails while the existing ones stay quiet. Re-save it with
      # `pnpm fallow:baseline` after real complexity comes out — and read a diff
      # to it in review, since a baseline can also be re-saved to bury a
      # regression.
      - name: Duplication
        run: pnpm fallow dupes

      - name: Complexity
        run: pnpm fallow:health

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # A branch that changes what a user can do carries a changeset (docs/releases.md).
  # "If needed" is a judgement call no path heuristic can make — a refactor and a
  # feature touch the same directories — so this is deliberately a *prompt with an
  # override*, not a wall: it fails only when app-visible source moved with no
  # changeset, and the `no changeset` label says "I considered it, the answer is
  # no". A gate with no override would be answered by filing empty changesets,
  # which is worse than not gating at all.
  changeset:
    name: Changeset filed (or declined)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The comparison is against the merge base, so the base branch's
          # history has to be here — the default shallow clone has neither.
          fetch-depth: 0

      - name: Require a changeset for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DECLINED: ${{ contains(github.event.pull_request.labels.*.name, 'no changeset') }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)

          if printf '%s\n' "$changed" | grep -qE '^\.changeset/.+\.md$'; then
            echo "A changeset is filed."
            exit 0
          fi

          # Tests and the release tooling itself are not what a user sees, so
          # they do not trigger the prompt even though they live under `src`.
          visible=$(printf '%s\n' "$changed" \
            | grep -E '^(apps/(web|admin|server)|packages/[^/]+)/src/' \
            | grep -vE '/src/tests/' \
            | grep -vE '\.test\.tsx?$' || true)

          if [ -z "$visible" ]; then
            echo "No user-visible source changed; no changeset needed."
            exit 0
          fi

          if [ "$DECLINED" = "true" ]; then
            echo "Labelled 'no changeset' — the author declined one deliberately."
            exit 0
          fi

          echo "::error::This PR changes app source but files no changeset."
          echo
          echo "If it changes what a user can do, run 'pnpm changeset' and commit the file."
          echo "If it does not — a refactor, a test, a dependency bump — add the"
          echo "'no changeset' label to this PR."
          echo
          echo "Source files that triggered this:"
          printf '%s\n' "$visible" | sed 's/^/  /'
          exit 1

  # Split from `verify` on purpose. These suites need a real Postgres, so they
  # are the only checks that can go red because a database is unreachable rather
  # than because the code is wrong — keeping them separate means that failure
  # mode never hides the typecheck, build, and pure-test signal.
  database-integration:
    name: Database integration tests (same-repo only)
    # A fork PR's workflow run receives no secrets, so `TEST_DATABASE_URL` would
    # be empty and the guard below would fail a check no outside contributor can
    # fix. Skipping the job outright makes absence the skip and leaves
    # presence-but-broken the failure. `github.event_name` has to be checked
    # first: on a push there is no `pull_request` payload, and comparing against
    # it would skip the job on `main` and `staging` too.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The staging connection string lives as an environment secret; this is the
    # only way a job can read it. Each test builds and drops its own schema, so
    # nothing here touches the data staging serves.
    environment: staging
    # Superseded runs are cancelled rather than left to pile up: three pushes in
    # a minute would otherwise mean three suites opening connections and churning
    # migrations through the same staging Postgres that serves local development.
    # A cancelled run leaves its `simmer_test_*` schema behind, which is what the
    # sweeper in `packages/db/src/test-support/db-integration.ts` cleans up.
    concurrency:
      group: db-integration-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@simmer-mosquito/server` imports the harness from `@simmer-mosquito/db`
      # at its `./test-support` entry point, so the package has to be built
      # before its integration suite can resolve it.
      - name: Build workspace
        run: pnpm build

      # Runs the package scripts directly rather than through nx: these suites
      # skip themselves when the URL is missing, so a cached "pass" from a run
      # without it would be indistinguishable from a real one.
      #
      # `@simmer-mosquito/server` is here as well as `db` because the reads that
      # decide whether a write happens — ownership and assignment lifecycle —
      # live in the server and take a plain `Transaction`. Its pure tests run
      # again as a side effect, which costs seconds.
      - name: Run integration suites
        env:
          TEST_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$TEST_DATABASE_URL"
          pnpm --filter @simmer-mosquito/db test
          pnpm --filter @simmer-mosquito/server test
