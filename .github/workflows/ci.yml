name: CI

on:
  pull_request:
  push:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The cheapest gate in the file, and the only one that can see a build-order
      # drift. `typecheck` and `build` both go through Nx, so they order from the
      # package.json dependency graph and can never disagree with themselves.
      # Every deploy orders from tsconfig `references` instead. This asserts the
      # two name the same edges; the `shipped-build` job below proves it by
      # running the deploy's own command.
      - name: Build graph
        run: pnpm check:build-graph

      # The other half of a command write is hand-typed. A body's `snake_case`
      # key names a column, and `payload` is a loose record, so a misspelled one
      # reads `undefined` and the caller still gets a 200. The reads have a
      # drift test against the database; this is the writes' equivalent.
      - name: Command columns
        run: pnpm check:command-columns

      # A write's own agency comes from the session; the ids it references come
      # from the payload, and a foreign key cannot see whose they are. This
      # asserts every write that names one goes through the reference gate.
      - name: Write references
        run: pnpm check:write-references

      - name: Typecheck
        run: pnpm typecheck

      # Structural rot: unused files/exports/dependencies, circular
      # dependencies, unresolved imports. Those default to `error` in fallow and
      # the workspace is at zero, so this fails on what a branch adds rather
      # than on a pre-existing backlog. The softer cleanup rules stay at `warn`
      # by choice (.fallowrc.jsonc).
      #
      # These go through the wrapper rather than `pnpm exec fallow` so a local
      # run on Windows behaves identically; it is a no-op on this runner.
      - name: Dead code
        run: pnpm fallow dead-code

      # Duplication and complexity are gated against where the workspace already
      # is, not against zero — the backlog is thousands of lines and hundreds of
      # units, so an absolute gate would fail every branch on history rather than
      # catch anything new.
      #
      # Duplication ratchets on the percentage in .fallowrc.jsonc. Complexity
      # compares per file and category against a saved baseline, so a branch that
      # adds a hotspot fails while the existing ones stay quiet. Re-save it with
      # `pnpm fallow:baseline` after real complexity comes out — and read a diff
      # to it in review, since a baseline can also be re-saved to bury a
      # regression.
      - name: Duplication
        run: pnpm fallow dupes

      - name: Complexity
        run: pnpm fallow:health

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # Builds each deployable app the way its Dockerfile does, and nothing else.
  #
  # `pnpm build` in `verify` is `nx run-many`, which is not the command that
  # ships: every Dockerfile and the server's Railpack build run
  # `pnpm --filter <app> build`, which is `tsc -b` and orders projects from
  # tsconfig `references` alone. When the two graphs disagree the filtered build
  # is the only one that fails, and it fails on the deploy — #175 broke all three
  # services on a merge whose CI was green.
  #
  # One runner per app on purpose, rather than three commands in a row. A
  # filtered build leaves the packages it built on disk, and a `dist` that is
  # already there satisfies an import whose build order was never declared — so
  # the second and third builds in a shared workspace would pass for the wrong
  # reason. That is the same staleness that made #175 read as a local
  # environment fault. Each app needs a tree nothing has built yet.
  #
  # For the same reason, never add a step that builds the workspace above this
  # one.
  #
  # The `VITE_*` values the two SPAs inline are absent here. Nothing ships out of
  # this job; it proves the compile resolves, and nothing more.
  shipped-build:
    name: Shipped build (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        app: [server, web, admin]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A fresh checkout has no build output, so this removes nothing here. It is
      # the same line the local reproduction needs — where a `dist` from any
      # earlier full build would hide the fault — and it is what keeps this job
      # honest if a build ever appears above it.
      - name: Clean build output
        run: |
          find apps packages -name '*.tsbuildinfo' -not -path '*/node_modules/.pnpm/*' -delete
          rm -rf apps/*/dist packages/*/dist

      - name: Build as the deploy does
        run: pnpm --filter @simmer-mosquito/${{ matrix.app }} build

  # A branch that changes what a user can do carries a changeset (docs/releases.md).
  # "If needed" is a judgement call no path heuristic can make — a refactor and a
  # feature touch the same directories — so this is deliberately a *prompt with an
  # override*, not a wall: it fails only when app-visible source moved with no
  # changeset, and the `no changeset` label says "I considered it, the answer is
  # no". A gate with no override would be answered by filing empty changesets,
  # which is worse than not gating at all.
  #
  # Declining one costs nothing that matters: the version still bumps at
  # promotion, because `pnpm release:version` floors every app the pending
  # changesets did not name. This gate is only ever asking whether the change
  # belongs on the changelog page.
  changeset:
    name: Changeset filed (or declined)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # The comparison is against the merge base, so the base branch's
          # history has to be here — the default shallow clone has neither.
          fetch-depth: 0

      - name: Require a changeset for user-visible changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DECLINED: ${{ contains(github.event.pull_request.labels.*.name, 'no changeset') }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)

          if printf '%s\n' "$changed" | grep -qE '^\.changeset/.+\.md$'; then
            echo "A changeset is filed."
            exit 0
          fi

          # Tests and the release tooling itself are not what a user sees, so
          # they do not trigger the prompt even though they live under `src`.
          visible=$(printf '%s\n' "$changed" \
            | grep -E '^(apps/(web|admin|server)|packages/[^/]+)/src/' \
            | grep -vE '/src/tests/' \
            | grep -vE '\.test\.tsx?$' || true)

          if [ -z "$visible" ]; then
            echo "No user-visible source changed; no changeset needed."
            exit 0
          fi

          if [ "$DECLINED" = "true" ]; then
            echo "Labelled 'no changeset' — the author declined one deliberately."
            exit 0
          fi

          echo "::error::This PR changes app source but files no changeset."
          echo
          echo "If it changes what a user can do, run 'pnpm changeset' and commit the file."
          echo "If it does not — a refactor, a test, a dependency bump — add the"
          echo "'no changeset' label to this PR."
          echo
          echo "Source files that triggered this:"
          printf '%s\n' "$visible" | sed 's/^/  /'
          exit 1

  # Split from `verify` on purpose: these suites are the only checks that need a
  # database at all, and they carry a build and a container the others do not.
  # Keeping them separate means the typecheck, build, and pure-test signal is not
  # waiting behind them.
  #
  # The database is a service container rather than the Railway staging Postgres.
  # That is what makes the job fast — every round-trip the harness makes is a
  # loopback one — and it also means the job cannot go red because a shared
  # database was unreachable, cannot churn migrations through the database a
  # developer's dev server is talking to, and needs no secret, so a fork PR gets
  # the same signal as any other.
  database-integration:
    name: Database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Superseded runs are cancelled for cost: three pushes in a minute would
    # otherwise pay for three full runs of a job nobody is going to read. The
    # database is no longer a reason — a container belongs to one run and dies
    # with it, so a cancelled run can neither pile up against a shared Postgres
    # nor leave a `simmer_test_*` schema behind.
    concurrency:
      group: db-integration-${{ github.ref }}
      cancel-in-progress: true

    services:
      # Matches Railway staging exactly (PostgreSQL 17.5, PostGIS 3.5.2), so the
      # job cannot be green on a version no environment actually runs, and the
      # same image the local compose file uses.
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simmer_test
        ports:
          - 5432:5432
        # The suites skip themselves when they cannot reach a database, so the
        # job waits for the container to accept connections rather than racing it.
        options: >-
          --health-cmd "pg_isready -U postgres -d simmer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/simmer_test?sslmode=disable
      # The container is destroyed with the job, so no `simmer_test_*` schema can
      # outlive the run and the harness skips its abandoned-schema sweep. The
      # sweep stays on for local and staging runs, where a Ctrl-C still litters.
      SIMMER_TEST_DATABASE_EPHEMERAL: 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `@simmer-mosquito/server` imports the harness from `@simmer-mosquito/db`
      # at its `./test-support` entry point, so the package has to be built
      # before its integration suite can resolve it.
      - name: Build workspace
        run: pnpm build

      # The migration set creates both extensions `if not exists`, which against
      # a fresh database would create them inside whichever throwaway schema got
      # there first — and take them with it when that schema is dropped. Staging
      # has them in `public` already; the container is given the same starting
      # point, so the migrations are the no-op they are everywhere else.
      - name: Prepare the database
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c 'create extension if not exists postgis' \
            -c 'create extension if not exists pgcrypto'

      # Runs the package scripts directly rather than through nx: these suites
      # skip themselves when the URL is missing, so a cached "pass" from a run
      # without it would be indistinguishable from a real one. The guard on the
      # URL stays for the same reason — it is what stops a silently skipped suite
      # from reporting as a pass.
      #
      # `@simmer-mosquito/server` is here as well as `db` because the reads that
      # decide whether a write happens — ownership and assignment lifecycle —
      # live in the server and take a plain `Transaction`. Its pure tests run
      # again as a side effect, which costs seconds.
      - name: Run integration suites
        run: |
          test -n "$TEST_DATABASE_URL"
          pnpm --filter @simmer-mosquito/db test
          pnpm --filter @simmer-mosquito/server test
