services:
  postgres:
    image: postgis/postgis:17-3.5
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=10
      - -c
      - max_wal_senders=10
    environment:
      POSTGRES_DB: simmer_mosquito
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d simmer_mosquito"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  electric:
    image: electricsql/electric:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/simmer_mosquito?sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_STORAGE_DIR: /var/lib/electric
    ports:
      # Electric listens on 3000 in the container; keep the host URL stable.
      - "3001:3000"
    volumes:
      - electric-data:/var/lib/electric

volumes:
  electric-data:
  postgres-data:
